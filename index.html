<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Siwar Jewelry — Follow us on social media">
  <meta name="theme-color" content="#121110">
  <title>Siwar Jewelry | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121110;
      --bg-accent: #1a1917;
      --card: #1e1d1b;
      --card-hover: #252320;
      --text: #f2efe9;
      --text-muted: #9a948c;
      --gold: #c4a574;
      --gold-dim: rgba(196, 165, 116, 0.15);
      --border: rgba(196, 165, 116, 0.12);
      --border-hover: rgba(196, 165, 116, 0.28);
      --icon-bg: #2a2825;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 8px 28px rgba(0, 0, 0, 0.35);
      --radius: 12px;

      /* Muted brand tones */
      --instagram: #c74b8a;
      --snapchat: #e8d44d;
      --tiktok: #e8e8e8;
      --facebook: #5b8fd9;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(196, 165, 116, 0.07) 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 400px;
      animation: fadeIn 0.5s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .profile {
      text-align: center;
      margin-bottom: 36px;
    }

    .avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--bg-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--gold);
      border: 1.5px solid var(--border-hover);
      box-shadow: var(--shadow);
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.625rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      color: var(--text);
    }

    .tagline {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .btn .icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn .icon svg {
      width: 20px;
      height: 20px;
    }

    .btn .label-wrap {
      flex: 1;
      text-align: left;
      min-width: 0;
    }

    .btn .label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }

    .btn .sublabel {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn .arrow {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      opacity: 0.35;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .btn:hover .arrow {
      opacity: 0.65;
      transform: translateX(2px);
    }

    /* Platform icon colors */
    .btn--instagram .icon svg { fill: var(--instagram); }
    .btn--snapchat .icon svg { fill: var(--snapchat); }
    .btn--tiktok .icon svg { fill: var(--tiktok); }
    .btn--facebook .icon svg { fill: var(--facebook); }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .footer .mark {
      font-family: 'Playfair Display', serif;
      font-size: 0.8125rem;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .footer p:last-child {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
